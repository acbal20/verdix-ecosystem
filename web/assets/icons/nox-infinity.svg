<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Verdix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f14"/>
      <stop offset="1" stop-color="#030609"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0.3" x2="0" y2="0.7">
      <stop offset="0" stop-color="#b6ffd2"/>
      <stop offset=".45" stop-color="#00ff41"/>
      <stop offset="1" stop-color="#00cc33"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur stdDeviation="10" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- contraste: fondo casi negro + marco verde neón -->
  <rect x="3" y="3" width="122" height="122" rx="24" fill="url(#bg)" stroke="#00ff41" stroke-opacity=".5" stroke-width="2.5"/>
  <rect x="9" y="9" width="110" height="110" rx="17" fill="none" stroke="#00ff41" stroke-opacity=".2" stroke-width="1.5"/>
  <!-- infinito de 8 acostado, neón -->
  <path d="M18 64 C18 34 46 34 64 64 C82 94 110 94 110 64 C110 34 82 34 64 64 C46 94 18 94 18 64 Z"
        fill="none" stroke="url(#neon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>
  <!-- núcleo claro para contraste -->
  <path d="M18 64 C18 34 46 34 64 64 C82 94 110 94 110 64 C110 34 82 34 64 64 C46 94 18 94 18 64 Z"
        fill="none" stroke="#eaffef" stroke-opacity=".9" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="64" cy="64" r="3.2" fill="#00ff41"/>
</svg>
